services:
  allennlp:
    build: ./docker/allennlp
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/allennlp
    restart: unless-stopped

  neo4j:
    image: neo4j:latest
    container_name: text2kg-neo4j
    ports:
      # The Neo4j browser and the Bolt port, reachable from this machine only.
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - ./.neo4j/data:/data
      - ./.neo4j/logs:/logs
      - ./.neo4j/conf:/conf
      - ./.neo4j/import:/var/lib/neo4j/import
      - ./.neo4j/plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/password1234
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  text2kg:
    build: ./docker/main/cpu
    environment:
      - ALLENNLP_URL=http://allennlp:8080
    ports:
      # The data service the desktop app talks to, reachable from this machine only.
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/text2kg
    depends_on:
      allennlp:
        condition: service_started
      neo4j:
        condition: service_healthy
    restart: unless-stopped