version: '3.8'
services:
  allennlp:
    build: ./docker/allennlp
    ports:
    - 8080:8080
    volumes:
    - .:/allennlp
  openie6:
    build: ./docker/openie6
    ports:
    - 8081:8081
    volumes:
    - .:/openie6
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
  text2kg:
    build: ./docker/text2kg
    volumes:
    - .:/text2kg
    depends_on:
    - allennlp
    - openie6
