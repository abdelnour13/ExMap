version: '3.8'
services:
  allennlp:
    build: ./docker/allennlp
    ports:
    - 8080:8080
    volumes:
    - .:/allennlp
  openie6:
    build: ./docker/openie6
    ports:
    - 8081:8081
    volumes:
    - .:/openie6
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
  neo4j:
    image: neo4j:latest
    container_name: text2kg-neo4j
    ports:
    - 7474:7474
    - 7687:7687
    volumes:
    - ./.neo4j/data:/data
    - ./.neo4j/logs:/logs
    - ./.neo4j/conf:/conf
    - ./.neo4j/import:/var/lib/neo4j/import
    - ./.neo4j/plugins:/plugins
    environment:
    - NEO4J_AUTH=neo4j/Abdelnour2003
    restart: always
  text2kg:
    build: ./docker/text2kg
    volumes:
    - .:/text2kg
    depends_on:
    - allennlp
    - openie6
    - neo4j
