version: '3.8'
services:
  allennlp:
    build: ./docker/allennlp
    ports:
    - 8080:8080
    volumes:
    - .:/allennlp
  neo4j:
    image: neo4j:latest
    container_name: text2kg-neo4j
    ports:
    - 7474:7474
    - 7687:7687
    volumes:
    - ./.neo4j/data:/data
    - ./.neo4j/logs:/logs
    - ./.neo4j/conf:/conf
    - ./.neo4j/import:/var/lib/neo4j/import
    - ./.neo4j/plugins:/plugins
    environment:
    - NEO4J_AUTH=neo4j/Abdelnour2003
    restart: always
  text2kg:
    build: ./docker/main
    volumes:
    - .:/text2kg
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    depends_on:
    - allennlp
    - neo4j