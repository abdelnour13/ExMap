version: '3.8'
services:
  allennlp:
    build: ./RPC/allennlp
    ports:
    - 8080:8080
    volumes:
    - .:/allennlp
  openie6:
    build: ./RPC/openie6
    ports:
    - 8081:8081
    volumes:
    - .:/openie6
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
